name: Interop Landing Numbers Page - S3 Sync
run-name: "${{ github.ref_name }} / ${{ inputs.environment }} - Interop Landing Numbers Page S3 Sync"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
    paths:
      - "src/assets/*"

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: environment

permissions:
  id-token: write
  contents: read

jobs:
  s3-sync:
    name: Synchronize static assets to S3
    runs-on: ubuntu-latest
    # Dynamically determine the environment to use (prod or dev) based on 'event_name' or 'ref' and 'ref_name'
    # If 'event_name' is 'workflow_dispatch', then use the input 'environment'
    # If the ref starts with 'refs/tags/', set environment to 'prod' in order to deploy tag correctly
    # If the ref_name is 'main', set environment to 'prod'
    # If the ref_name is 'develop', set environment to 'dev'
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || startsWith(github.ref, 'refs/tags/') && 'prod' || github.ref_name == 'main' && 'prod' || github.ref_name == 'develop' && 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          role-session-name: interop-landing-numbers-page-s3-sync-${{ github.run_number }}

      - name: Sync files to S3
        run: |
          aws s3 sync src/assets/ s3://${{ vars.S3_BUCKET_NAME }}/assets/ --delete
